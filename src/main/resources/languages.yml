# Языки WoW в чате (модуль chat, config.yml -> chat).
#
# Каждая раса знает язык своей фракции и свой расовый язык (как в WoW). Говорит игрок на первом языке
# списка, сменить: /lang <язык>. Кто язык не знает, видит тарабарщину: каждое слово заменяется
# выдуманным словом той же длины из слогов языка (одно и то же слово всегда превращается в одно и то же).
# Выучить чужой язык (шпион, учитель, квест): /twm lang give <ник> <язык>; забыть: /twm lang take.
# Право twm.lang.all (по умолчанию у OP) — понимать все языки (модераторам нужно видеть настоящий текст).

languages:
  common:      {name: 'Всеобщий',        syllables: [ва, лан, дор, ре, ми, тор, ас, бен, ло, нор, ка, дел, ис, мар, уна, эн, гар, ти]}
  orcish:      {name: 'Орочий',          syllables: [зуг, гар, мок, краш, лок, тар, кек, огар, даб, ру, гул, мог, нак, ош, грон, ка, "'"]}
  dwarvish:    {name: 'Дворфийский',     syllables: [бром, гар, дун, хур, кхаз, ор, дрим, бар, тук, мол, грим, ак]}
  darnassian:  {name: 'Дарнасский',      syllables: [ан, дор, ше, ла, тала, эль, нир, ин, шан, ара, фал, ду, иэ, ни]}
  gnomish:     {name: 'Гномский',        syllables: [тик, мек, ги, спр, ок, дет, нок, бим, ли, зап, ник, физ]}
  draenei:     {name: 'Дренейский',      syllables: [ак, ор, ниа, зе, кир, ара, мун, ди, аш, ре, вен, то]}
  gilnean:     {name: 'Гилнеасский',     syllables: [гор, вин, ст, эн, лок, бер, хол, дет, ар, ви, ман, то]}
  gutterspeak: {name: 'Наречие нежити',  syllables: [гхор, скр, аз, морт, ул, нек, ш, гр, веш, дор, ах, зул]}
  taurahe:     {name: 'Таурахэ',         syllables: [ах, мо, ни, ша, на, ту, рах, кра, хе, ока, ло, ми]}
  zandali:     {name: 'Зандаларский',    syllables: [ман, ду, зан, джа, ка, ни, мон, ту, ра, во, ди, ши]}
  thalassian:  {name: 'Талассийский',    syllables: [ше, лу, ан, дор, ал, ла, ни, ри, тал, эн, са, ва]}
  goblin:      {name: 'Гоблинский',      syllables: [грик, зап, мак, фрак, ни, ток, бз, ги, рат, шм, кх, ла]}

# Раса (id из races.yml) -> языки, первый — на котором говорит по умолчанию.
races:
  human:    [common]
  dwarf:    [common, dwarvish]
  nightelf: [common, darnassian]
  gnome:    [common, gnomish]
  draenei:  [common, draenei]
  worgen:   [common, gilnean]
  orc:      [orcish]
  undead:   [orcish, gutterspeak]
  tauren:   [orcish, taurahe]
  troll:    [orcish, zandali]
  bloodelf: [orcish, thalassian]
  goblin:   [orcish, goblin]
