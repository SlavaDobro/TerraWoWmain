name: TerraWoWmain
version: 1.1.0
main: ru.terrawow.main.TerraWoWmain
api-version: '26.3'
author: TerraWoW
description: Основной плагин сервера TerraWoW (меню, экономика, маунты, питомцы, расы)
load: POSTWORLD
softdepend: [Vault, PlaceholderAPI]
loadbefore: [MMOCore, MMOItems, CMI]
# Все функции — подкоманды /twm: /twm economy, /twm mount, /twm pet, /twm race, /twm racial.
# /menu (/wow), /mounts, /pets, /race, /racial — короткие варианты для игроков.
commands:
  twm:
    description: 'TerraWoWmain: /twm menu | economy | mount | pet | race | racial | reload'
    usage: /twm help
  mounts:
    description: Маунты (то же, что /twm mount)
    aliases: [mount]
    permission: twm.mount
  pets:
    description: Питомцы (то же, что /twm pet)
    aliases: [pet]
    permission: twm.pet
  race:
    description: Раса (то же, что /twm race)
    permission: twm.race
  racial:
    description: Расовая способность (то же, что /twm racial)
    permission: twm.race
  lang:
    description: 'Язык, на котором вы говорите (Всеобщий, Орочий, расовые)'
    permission: twm.race
  menu:
    description: Главное меню сервера (то же, что /twm menu)
    aliases: [wow]
permissions:
  twm.economy.use:
    default: true
  twm.economy.balance:
    default: true
  twm.economy.pay:
    default: true
  twm.economy.exchange:
    default: true
  twm.economy.history:
    default: true
  twm.economy.bank:
    default: true
  twm.economy.bank.buy:
    default: true
  twm.economy.bank.rename:
    default: true
  twm.economy.bank.money:
    default: true
  twm.economy.mail:
    default: true
  twm.economy.mail.send:
    default: true
  twm.economy.mail.claim:
    default: true
  twm.economy.trade:
    default: true
  twm.economy.auction:
    default: true
  twm.economy.auction.sell:
    default: true
  twm.economy.auction.buy:
    default: true
  twm.economy.deposit:
    default: true
  twm.economy.withdraw:
    default: true
  twm.economy.cheque:
    default: true
  twm.economy.admin.money:
    default: op
  twm.economy.admin.reward:
    default: op
  twm.economy.admin.npc:
    default: op
  twm.economy.admin.diagnose:
    default: op
  twm.economy.admin.backup:
    default: op
  twm.economy.admin.recovery:
    default: op
  twm.economy.bank.remote:
    default: op
  twm.economy.mail.remote:
    default: op
  twm.economy.guild:
    default: true
  twm.economy.guild.create:
    default: op
  twm.economy.bank.xp:
    default: true
  twm.mount:
    description: Журнал маунтов, призыв
    default: true
  twm.pet:
    description: Журнал питомцев, призыв
    default: true
  twm.race:
    description: Карточка расы, выбор расы, расовая способность
    default: true
  twm.lang.all:
    description: 'Понимать все языки в чате (модераторы)'
    default: op
  twm.chat.staff:
    description: 'Получать сообщения фильтра чата (нарушения правил)'
    default: op
  twm.chat.filter.bypass:
    description: 'Не проверяться фильтром чата'
    default: false
  twm.chat.spy:
    description: 'Слышать чат на любом расстоянии'
    default: false
  twm.admin:
    description: 'Админ-команды маунтов, питомцев и рас (give/take/unlock/set/reset/reload)'
    default: op
